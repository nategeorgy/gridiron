[pytest]
# Run from backend/:  .venv/bin/python -m pytest
testpaths = tests

# Put backend/ on sys.path so tests import the app the same way the app imports
# itself (`from app.auth import ...`). Without this, pytest would only add tests/
# to the path and every `import app` would fail.
pythonpath = .

addopts = -q --strict-markers

# No async tests exist yet (every handler is sync `def`). Pinned so pytest-asyncio
# does not warn about an unset default, and so the first async test inherits a
# per-test loop rather than a surprising shared one.
asyncio_default_fixture_loop_scope = function

markers =
    slow: tests that are noticeably slower than the rest of the suite.
