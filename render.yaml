# Render Blueprint for the GridironIQ backend API.
# Render reads this file when you create a "Blueprint" from the repo.
#
# NOTE: editing this file does not reconfigure a service that was created from an
# earlier version of it. Render syncs a Blueprint on push, but a service whose settings
# were changed in the dashboard keeps the dashboard's values — so after changing the
# build command here, confirm it took in the service's Settings page.
#
# The database is hosted separately on Supabase; its connection string and the
# allowed CORS origin are set as (secret) environment variables in the Render
# dashboard — they are intentionally NOT committed here.
services:
  - type: web
    name: gridiron-api
    runtime: python
    rootDir: backend
    plan: free

    # Migrations run in the build. `preDeployCommand` is the hook designed for this and
    # is paid-only, so on the free plan Render's docs point here instead.
    #
    # ⚠️ It calls `scripts/migrate.sh` rather than a bare `alembic upgrade head`, and
    # the reason is worth keeping. The bare version failed once (5d111be) — and not on
    # connectivity, which was the obvious guess and was wrong. The build reached
    # Supabase and then could not get a connection out of it:
    #
    #     FATAL: (ECHECKOUTTIMEOUT) unable to check out connection from the pool
    #            after 15000ms in Session mode
    #
    # A build runs while the PREVIOUS version is still serving, so the app's own pool
    # holds connections at exactly the moment the migration wants one — and SQLAlchemy
    # defaults to pool_size=5 with max_overflow=10, i.e. **fifteen**, against a
    # free-tier session-mode pooler. `app/database.py` now caps the app at five, which
    # is the real fix; the script retries, because this contention is transient by
    # nature (a scheduled pipeline run produces it just as easily).
    #
    # Failure modes preserved: a genuinely broken migration exits non-zero after its
    # retries, the build fails, and the previous version keeps serving.
    #
    # ⚠️ A DESTRUCTIVE migration would be briefly live before the code that tolerates
    # it. Split those across two deploys — ship the tolerant code first, drop the column
    # later. Every migration in this repo so far only adds nullable columns, which the
    # running version cannot see.
    buildCommand: pip install -r requirements.txt && ./scripts/migrate.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # set in dashboard — the Supabase connection string
      - key: CORS_ORIGINS
        sync: false          # set in dashboard — the Vercel frontend URL
