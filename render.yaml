# Render Blueprint for the GridironIQ backend API.
# Render reads this file when you create a "Blueprint" from the repo.
#
# NOTE: editing this file does not reconfigure a service that was created from an
# earlier version of it. Render syncs a Blueprint on push, but a service whose settings
# were changed in the dashboard keeps the dashboard's values — so after changing the
# build command here, confirm it took in the service's Settings page.
# The database is hosted separately on Supabase; its connection string and the
# allowed CORS origin are set as (secret) environment variables in the Render
# dashboard — they are intentionally NOT committed here.
services:
  - type: web
    name: gridiron-api
    runtime: python
    rootDir: backend
    plan: free
    # ⚠️ THERE IS STILL NO MIGRATION STEP HERE, and it is not for lack of trying.
    # `preDeployCommand` — the hook designed for this — is paid-only and this service
    # is on the free plan. Render's docs point at the build command instead, so
    # 5d111be tried:
    #
    #     buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    #
    # The build failed ("Exited with status 1") and was reverted in the next commit,
    # because a broken deploy path is worse than the manual step it replaced. What was
    # ruled out afterwards, so the next attempt does not re-tread it:
    #
    #   * Env vars ARE available during a Render build, so DATABASE_URL was present.
    #   * `alembic` is in requirements.txt and `prepend_sys_path = .` is set in
    #     alembic.ini, so `app` imports fine from rootDir either way.
    #   * The exact command runs locally from `backend/`, is a no-op at head, and
    #     exits 1 on an unreachable database.
    #
    # The untested candidate is **network egress from the build container to
    # Supabase**. Runtime connectivity demonstrably works (`/api/v1/health` reports
    # "database":"connected"), so the promising next attempt is the **startCommand**:
    #
    #     startCommand: python -m alembic upgrade head && uvicorn app.main:app ...
    #
    # which migrates where the database is known to be reachable. Read the failed
    # build's log first — this note exists so nobody repeats the same guess.
    #
    # Until then: apply migrations to Supabase by hand BEFORE merging a schema change.
    # Adding nullable columns first is safe — the running version cannot see them.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # set in dashboard — the Supabase connection string
      - key: CORS_ORIGINS
        sync: false          # set in dashboard — the Vercel frontend URL
