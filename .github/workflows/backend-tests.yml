# Runs the backend test suite (backend/tests/) on every pull request and on main.
#
# The `pytest` job below is a **required status check** on main: a pull request cannot
# merge while it is red. That is also why this workflow is deliberately unconditional —
# no `paths:` filter. Filtering to `backend/**` would save a minute on documentation PRs
# and would also mean the check never reports on them, which now means they could never
# merge at all. The suite itself takes about a second; almost all of the runtime below is
# checkout and pip.
name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

# One run per branch. A force-push supersedes the run it interrupted rather than racing it.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    services:
      # Credentials and version match docker-compose.yml, so the suite's default
      # TEST_DATABASE_URL resolves here with no override and CI runs the same command a
      # developer does. The image's POSTGRES_USER is a superuser, which the suite needs:
      # it creates and drops its own `gridiron_test` database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gridiron
          POSTGRES_PASSWORD: gridiron
          POSTGRES_DB: gridiron
        ports:
          - 5432:5432
        # Without a health check the job races the database and fails intermittently on
        # a cold runner.
        options: >-
          --health-cmd "pg_isready -U gridiron -d gridiron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.12 specifically: psycopg2-binary publishes no wheels for 3.13+, and
          # building from source needs pg_config on PATH.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Only the backend's dependencies. The pipeline's are irrelevant here and are the
      # slow ones to install.
      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # No SUPABASE_* or DATABASE_URL is set, and none is needed: tests/conftest.py puts
      # its own values in the environment before the first `import app`, and an autouse
      # fixture stubs the JWKS client so nothing reaches the network.
      #
      # The schema is built by `alembic upgrade head`, inside the suite. Do not replace
      # that with Base.metadata.create_all() to save time — migration 8f73b5b2b1a1 (RLS
      # on the account tables) adds no table and no column, so it would be silently
      # skipped and tests/test_rls.py would be testing nothing.
      - name: Run tests
        working-directory: backend
        run: python -m pytest
