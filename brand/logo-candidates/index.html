<head>
<meta charset="utf-8">

<title>Second Level Logo Candidates</title>
<style>
  :root {
    --bg: #f6f6f5; --surface: #ffffff; --fg: #16181a; --muted: #6b7280;
    --line: #e4e4e2; --accent: #00b06a; --well-dark: #15181a; --well-light: #ffffff;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #0d0f11; --surface: #16191c; --fg: #f2f3f4; --muted: #9aa1a8;
      --line: #262a2e; --accent: #2ecc71; --well-light: #f2f2f0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f11; --surface: #16191c; --fg: #f2f3f4; --muted: #9aa1a8;
    --line: #262a2e; --accent: #2ecc71; --well-light: #f2f2f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 56px; background: var(--bg); color: var(--fg);
    font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  section { margin-top: 34px; }
  h2 {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .count {
    font-size: 11px; letter-spacing: 0; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: 999px; padding: 1px 7px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .tile { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tile a { display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 132px; }
  .tile.dark a { background: var(--well-dark); }
  .tile.light a { background: var(--well-light); }
  .tile img { max-width: 100%; max-height: 118px; height: auto; display: block; }
  figcaption {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 9px 11px 11px; border-top: 1px solid var(--line);
  }
  .nm { font-size: 12.5px; font-weight: 550; }
  code { font: 11px/1 "JetBrains Mono", "Roboto Mono", ui-monospace, monospace; color: var(--muted); }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
</style>
</head>
