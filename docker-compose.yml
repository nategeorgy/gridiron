# Local development database for GridironIQ.
#   Start:  docker compose up -d
#   Stop:   docker compose down          (data persists in the named volume)
#   Reset:  docker compose down -v        (drops the volume — wipes all data)
services:
  db:
    image: postgres:16
    container_name: gridiron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridiron
      POSTGRES_PASSWORD: gridiron
      POSTGRES_DB: gridiron
    ports:
      - "5432:5432"
    volumes:
      - gridiron_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridiron -d gridiron"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gridiron_pgdata:
